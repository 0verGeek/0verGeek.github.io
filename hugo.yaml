# =============================================================================
# 📌 Hugo + PaperMod 完整配置文件（含全部可选配置及详细注释）
# =============================================================================
# 使用说明：
# - 🟢 绿色注释 = 推荐开启 / 建议保留
# - 🟡 黄色注释 = 根据需求可选
# - 🔴 红色注释 = 特殊情况才开启
# - 所有带 # 的配置项，去掉 # 即可启用
# =============================================================================

# =============================================================================
# 🏗️ 核心配置 — 必填项
# =============================================================================
baseURL: "https://0verGeek.github.io/" # 🔴 网站根 URL，生产环境必须填写
title: "依然达文西's Blog" # 🟢 浏览器标题栏显示的文字
theme: PaperMod # 🟢 主题名称（必须与 themes/ 目录匹配）
locale: "zh-CN" # 🟡 站点语言区域设置
defaultContentLanguage: "zh" # 🟡 默认内容语言
hasCJKLanguage: true # 🟢 启用 CJK 语言支持（中文、日文、韩文）
paginate: 5 # 🟢 每页显示的文章数（列表页翻页用）

# =============================================================================
# 🌐 输出格式 — 搜索功能必须
# =============================================================================
outputs:
  home:
    - HTML
    - RSS
    - JSON # 🟢 搜索功能依赖 JSON，必须有！

# =============================================================================
# 🤖 SEO 和索引控制
# =============================================================================
enableRobotsTXT: true # 🟢 自动生成 robots.txt
buildDrafts: false # 🟢 生产环境不显示草稿
buildFuture: false # 🟢 不显示未来日期的文章
buildExpired: false # 🟢 不显示已过期的文章

# =============================================================================
# 📦 资源压缩（生产环境建议开启）
# =============================================================================
minify:
  disableXML: true # 🟡 不压缩 XML（sitemap 等）
  minifyOutput: true # 🟢 开启 HTML/CSS/JS 压缩

# =============================================================================
# 📝 菜单导航 — 决定顶栏显示哪些链接
# =============================================================================
menu:
  main:
    - identifier: posts # 🟢 内部标识，不能重复
      name: 文章 # 🟢 显示的文字
      url: /posts/ # 🟢 链接地址
      weight: 10 # 🟢 数字越小越靠左
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 40
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 50
    - identifier: about
      name: 关于
      url: /about/
      weight: 60
    # - identifier: external                         # 🟡 外部链接也可以
    #   name: GitHub
    #   url: "https://github.com/xxx"
    #   weight: 70

# =============================================================================
# 🏷️ 分类法（Taxonomy）— 标签/分类系统
# =============================================================================
taxonomies:
  tag: tags # 🟢 标签
  category: categories # 🟢 分类

# =============================================================================
# 📜 语法高亮 — Hugo 内置的 Chroma（推荐）
# =============================================================================
markup:
  goldmark:
    renderer:
      hardWraps: true # 🟢 代码块自动换行
      unsafe: true # 🟢 允许正文中使用原始 HTML（如 <div> 包裹公式）
  highlight:
    noClasses: false # 🟢 使用 CSS 类而非行内样式
    codeFences: true # 🟢 支持 ``` 代码块
    guessSyntax: true # 🟢 自动猜测语言
    lineNos: true # 🟡 显示行号（可设为 false 关闭）
    lineNumbersInTable: true # 🟢 行号放在独立列，方便复制
    tabWidth: 4 # 🟡 Tab 宽度

# =============================================================================
# ═════════════════════════════════════════════════════════════════════════════
# 📌 Params 区域 — PaperMod 主题的几乎所有功能都在这里配置
# ═════════════════════════════════════════════════════════════════════════════
# =============================================================================
params:
  # ---------------------------------------------------------------------------
  # 🌍 环境 & 基础信息
  # ---------------------------------------------------------------------------
  env: production # 🟢 设为 production 时会启用某些优化
  title: "依然达文西's Blog" # 🟢 覆盖顶部 title 显示
  description: "这是我的个人博客" # 🟢 站点描述，SEO 重要
  keywords: [Blog, 博客, PaperMod] # 🟡 SEO 关键词
  author: "Camuss" # 🟢 全局作者名（文章可单独覆盖）
  images: ["/images/default.png"]
  # ---------------------------------------------------------------------------
  # 📅 日期格式
  # ---------------------------------------------------------------------------
  # DateFormat: "2006-01-02" # 🟢 Go 语言日期格式
  # DateFormat: "January 2, 2006"                   # 🟡 英文格式
  DateFormat: "2006年1月2日"                      # 🟡 中文格式

  # ---------------------------------------------------------------------------
  # 🌗 主题模式 — 白天/夜间/自动
  # ---------------------------------------------------------------------------
  defaultTheme: auto # 🟢 auto=跟随系统 | light | dark
  disableThemeToggle: false # 🟢 false=显示切换按钮 | true=隐藏

  # ---------------------------------------------------------------------------
  # 🏠 首页显示模式（二选一，注释掉不用的那个）
  # ---------------------------------------------------------------------------

  # 🅰️ 模式 A: HomeInfo 模式 — 显示标题+简介文字（推荐新手）
  # ---------------------------------------------------------------------------
  homeInfoParams:
    Title: "👋 你好，欢迎来到我的博客"
    Content: >
      这里是我的个人空间，分享技术、生活和一切有趣的事物。
      用 Hugo + PaperMod 搭建，希望能给你带来一些启发。

  # ---------------------------------------------------------------------------
  # 🅱️ 模式 B: Profile 模式 — 显示头像+名字+按钮（个人名片风格）
  # ---------------------------------------------------------------------------
  profileMode:
    enabled: false                                 # 🟡 改为 true 启用此模式
    title: "依然达文西"                              # 🟡 大标题
    subtitle: "We can change the world"   # 🟡 副标题
    imageUrl: "/avatar.png"                        # 🟡 头像路径（放 static/ 下）
    # imageTitle: "这是我的头像"                     # 🟡 图片 alt 文本
    imageWidth: 150                                # 🟡 图片宽度（px）
    imageHeight: 150                               # 🟡 图片高度（px）
    buttons:                                       # 🟡 首页按钮列表
      - name: 📝 文章
        url: "/posts/"
      - name: 📂 归档
        url: "/archives/"
      - name: 🐱 GitHub
        url: "https://github.com/0vergeek"

  # ---------------------------------------------------------------------------
  # 🔗 社交图标 — 在首页和个人资料页底部显示
  # ---------------------------------------------------------------------------
  socialIcons:
    - name: github
      url: "https://github.com/0verGeek"
    # - name: x # 🟡 即 Twitter/X
      # url: "https://x.com/你的用户名"
    - name: email
      url: "mailto:albert.wawnq@gmail.com"
    # - name: zhihu                                # 🟡 知乎
    #   url: "https://zhihu.com/people/xxx"
    - name: bilibili # 🟡 B站
      url: "https://space.bilibili.com/35974578"
    # - name: rss                                  # 🟡 RSS 订阅
    #   url: "/index.xml"
    # 完整图标列表：https://github.com/adityatelange/hugo-papermod/wiki/Icons

  # ---------------------------------------------------------------------------
  # 🖼️ 标签（Label）— 左上角显示的文字/图标
  # ---------------------------------------------------------------------------
  label:
  #   text: "🏠 首页"                              # 🟡 显示文字（不设置则显示站点名）
    icon: "/icon.png"                            # 🟡 图标路径
    iconHeight: 35                               # 🟡 图标高度（px）
  footer:
    hideCopyright: false # 🟢 false=显示版权信息 | true=隐藏
    hideCredits: false # 🟢 false=显示主题信息 | true=隐藏
  # ---------------------------------------------------------------------------
  # 📄 文章页面显示开关 — 控制每篇文章显示哪些元素
  # ---------------------------------------------------------------------------
  ShowDate: true # 🟢 显示文章发布日期
  ShowLastmod: true # 🟢 显示文章最后修改时间
  ShowDateUpdated: true # 🟢 显示文章发布日期和最后修改时间
  ShowReadingTime: true # 🟢 显示预计阅读时间
  ShowWordCount: true # 🟢 显示字数
  ShowPageViews: true # 🟢 显示文章访问量（依赖 Waline pageview）
  ShowBreadCrumbs: true # 🟢 显示面包屑导航（首页 > 分类 > 文章名）
  ShowPostNavLinks: true # 🟢 文章底部显示上一篇/下一篇
  ShowCodeCopyButtons: true # 🟢 代码块右上角显示复制按钮
  ShowShareButtons: true # 🟡 文章底部显示分享按钮
  ShowRssButtonInSectionTermList: true # 🟡 分类/标签页显示 RSS 按钮
  enableGitInfo: true # 🟢 启用 Git 信息（文章最后修改时间、作者等）
  UseHugoToc: false # 🟢 使用 Hugo 自带的目录生成
  ShowToc: true # 🟡 是否默认显示目录（false=折叠）
  TocOpen: true                                   # 🟡 目录是否默认展开（需配合 showtoc）
  # hidemeta: false                                 # 🟡 隐藏文章元信息（日期、作者等）
  # hideSummary: false                              # 🟡 在列表页隐藏摘要
  # hideFooter: false                               # 🟡 隐藏页脚

  # ---------------------------------------------------------------------------
  # 🖼️ 封面图（Cover Image）全局设置
  # ---------------------------------------------------------------------------
  cover:
    linkFullImages: true # 🟡 点击封面图跳转到原图
    responsiveImages: true # 🟢 自动生成响应式多尺寸图片
    # hidden: false                                 # 🟡 全局隐藏封面图
    # hiddenInList: false                           # 🟡 在列表页隐藏封面图
    # hiddenInSingle: false                         # 🟡 在文章页隐藏封面图

  # ---------------------------------------------------------------------------
  # ✏️ 编辑文章链接 — 方便读者帮你改错字
  # ---------------------------------------------------------------------------
  # editPost:
  #   URL: "https://github.com/你的用户名/你的仓库/edit/main/content"
  #   Text: "✏️ 建议修改"                           # 🟡 按钮文字
  #   appendFilePath: true                          # 🟢 自动追加文件路径

  # ---------------------------------------------------------------------------
  # 💬 评论系统 — 以下四选一
  # ---------------------------------------------------------------------------
  comments: true # 🟡 true=启用评论（需配合下方模板）
  # disqusShortname: "你的disqus短名"               # 🟡 Disqus（简单但带广告）
  # 其他评论系统需要自己在 layouts/partials/comments.html 中配置
  # 支持的方案：utterances（GitHub Issues）、giscus（GitHub Discussions）、
  #           Waline、Twikoo、来比力 等

  # ---------------------------------------------------------------------------
  # 📊 访问统计 — 基于 Waline pageview（独立于评论系统）
  # ---------------------------------------------------------------------------
  walineServerURL: "https://0vergeek.vercel.app" # 🟢 Waline 服务端地址
  walinePageviewUpdate: true # 🟢 true=每次访问阅读量+1 | false=只读不增

  # ---------------------------------------------------------------------------
  # 🎨 资源文件 — Favicon 等
  # ---------------------------------------------------------------------------
  assets:
    favicon: "/favicon/favicon.ico" # 🟢 网站图标
    favicon16x16: "/favicon/favicon-16x16.png"            # 🟡 16x16 图标
    favicon32x32: "/favicon/favicon-32x32.png"            # 🟡 32x32 图标
    apple_touch_icon: "/favicon/apple-touch-icon.png"     # 🟡 iOS 主屏图标
    safari_pinned_tab: "/favicon/favicon.svg"   # 🟡 Safari 标签图标
    disableHLJS: true # 🟢 禁用 Highlight.js（使用 Hugo Chroma）
    # disableFingerprinting: true                   # 🔴 禁用资源指纹（不推荐，影响缓存）

  # ---------------------------------------------------------------------------
  # 🔍 搜索配置（Fuse.js）— 需要 outputs 中有 JSON
  # ---------------------------------------------------------------------------
  fuseOpts:
    isCaseSensitive: false # 🟢 是否区分大小写
    shouldSort: true # 🟢 按相关性排序
    location: 0 # 🟢 匹配位置权重
    distance: 1000 # 🟢 模糊匹配距离
    threshold: 0.4 # 🟢 匹配阈值（0=精确, 1=全模糊）
    minMatchCharLength: 0 # 🟢 最少匹配字符数
    limit: 10 # 🟡 最大显示结果数
    keys: # 🟢 搜索范围
      - "title"
      - "permalink"
      - "summary"
      - "content"

  # ---------------------------------------------------------------------------
  # 🌐 多语言支持（不需要可注释掉）
  # ---------------------------------------------------------------------------
  displayFullLangName: true                       # 🟡 显示完整语言名而非缩写
  # defaultContentLanguage: "zh"                    # 🟡 已在顶层配置

  # ---------------------------------------------------------------------------
  # 🧩 Schema.org 结构化数据（SEO 增强）
  # ---------------------------------------------------------------------------
  schema:
    publisherType: "Organization"                 # 🟡 Organization | Person
    sameAs:                                       # 🟡 社交媒体链接
      - "https://github.com/0verGeek"
  #     - "https://x.com/你的用户名"

  # ---------------------------------------------------------------------------
  # 📡 RSS 设置
  # ---------------------------------------------------------------------------
  rss:
    title: "依然da文西's Blog"                     # 🟢 RSS 标题
    description: "这是我的个人博客"                 # 🟢 RSS 描述
    limit: 20                                      # 🟡 RSS 显示的文章数

  # ---------------------------------------------------------------------------
  # 🔗 规范链接（Canonical URL）— 防止内容重复被降权
  # ---------------------------------------------------------------------------
  CanonicalLinkText: "原文发布于"                  # 🟡 显示的文字

  # ---------------------------------------------------------------------------
  # 🖥️ 其他杂项
  # ---------------------------------------------------------------------------
  # robotsNoIndex: false                            # 🔴 禁止搜索引擎收录（调试用）
  # disableSpecial1stPost: false                    # 🟡 禁用首页第一篇特殊高亮
  # disableAnchoredHeadings: false                  # 🟡 禁用标题锚点链接（#号）

# =============================================================================
# ═════════════════════════════════════════════════════════════════════════════
# 📌 文章前置元数据（Frontmatter）— 每篇文章开头的 --- 之间的内容
# ═════════════════════════════════════════════════════════════════════════════
# 写在单篇文章里，不是全局配置，但这里列出来方便参考
# =============================================================================
# ---
# title: "文章标题"
# date: 2024-01-01T10:00:00+08:00
# draft: false                                     # true=草稿，hugo server -D 可见
# weight: 1                                        # 越小越靠前（覆盖日期排序）
# tags: ["标签1", "标签2"]
# categories: ["分类1"]
# author: "作者名"                                 # 覆盖全局作者
# description: "文章描述，会显示在摘要和SEO中"
# summary: "自定义摘要，不写则自动截取正文前70字"
# aliases: ["/old-url"]                            # 旧URL重定向
# canonicalURL: "https://原始出处.com"             # 原文链接（转载时用）
# keywords: ["关键词"]                             # 页面级 SEO 关键词
#
# # 显示控制（true/false）
# showToc: true                                    # 显示目录
# TocOpen: false                                   # 目录默认展开
# hidemeta: false                                  # 隐藏文章元信息
# comments: true                                   # 开启评论
# disableShare: false                              # 禁用分享按钮
# disableHLJS: false                               # 禁用高亮
# hideSummary: false                               # 隐藏摘要
# searchHidden: false                              # 从搜索结果中隐藏
# hideFooter: false                                # 隐藏页脚
# ShowReadingTime: true
# ShowBreadCrumbs: true
# ShowPostNavLinks: true
# ShowWordCount: true
# ShowRssButtonInSectionTermList: true
# UseHugoToc: true
# ShowCanonicalLink: false                         # 显示原文链接标识
# robotsNoIndex: false                             # 禁止该页被索引
#
# # 封面图
# cover:
#     image: "/images/封面图.jpg"                  # 必填
#     alt: "替代文本"
#     caption: "图片说明文字"
#     relative: false                              # true=使用相对路径
#     hidden: false                                # 在该页隐藏封面图
#     responsiveImages: true
#
# # 编辑链接
# editPost:
#     URL: "https://github.com/xxx/content"
#     Text: "建议修改"
#     appendFilePath: true
# ---
