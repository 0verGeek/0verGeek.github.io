<script>
    (function () {
        var shareButtons = document.querySelector('.share-buttons');
        if (!shareButtons) return;

        var url = shareButtons.dataset.shareUrl;
        var title = shareButtons.dataset.shareTitle;
        var copyButton = document.getElementById('copy-share-link');
        var nativeButton = document.querySelector('.native-share');
        var zhihuLink = document.querySelector('.zhihu-share');
        var csdnLink = document.querySelector('.csdn-share');
        var copyLabel = copyButton ? copyButton.querySelector('span') : null;
        var nativeLabel = nativeButton ? nativeButton.querySelector('span') : null;

        if (copyButton) {
            copyButton.addEventListener('click', function () {
                if (!navigator.clipboard) {
                    if (copyLabel) copyLabel.textContent = '请手动复制';
                    return;
                }
                navigator.clipboard.writeText(url).then(function () {
                    if (copyLabel) copyLabel.textContent = '已复制';
                    window.setTimeout(function () {
                        if (copyLabel) copyLabel.textContent = '复制';
                    }, 1600);
                });
            });
        }

        if (zhihuLink) {
            zhihuLink.addEventListener('click', function () {
                if (navigator.clipboard) navigator.clipboard.writeText(url);
            });
        }

        if (csdnLink) {
            csdnLink.addEventListener('click', function () {
                if (navigator.clipboard) navigator.clipboard.writeText(url);
            });
        }

        if (nativeButton) {
            nativeButton.addEventListener('click', function () {
                if (navigator.share) {
                    navigator.share({ title: title, url: url });
                    return;
                }

                if (!navigator.clipboard) {
                    if (nativeLabel) nativeLabel.textContent = '请手动复制';
                    return;
                }

                navigator.clipboard.writeText(url).then(function () {
                    if (nativeLabel) nativeLabel.textContent = '已复制';
                    window.setTimeout(function () {
                        if (nativeLabel) nativeLabel.textContent = '更多';
                    }, 1600);
                });
            });
        }
    })();
</script>
