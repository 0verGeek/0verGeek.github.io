{{- with .Site.Params.metingApi -}}
{{- /* ====== APlayer 资源（自托管，无 CDN 依赖） ====== */ -}}
<link rel="stylesheet" href='{{ "css/aplayer.min.css" | relURL }}'>
<script src='{{ "js/aplayer.min.js" | relURL }}'></script>

{{- /* APlayer 本体容器（CSS 隐藏，仅胶囊 UI 可见） */ -}}
<div id="aplayer-container"></div>

{{- /* ====== 胶囊播放器 ====== */ -}}
<div class="music-capsule" id="music-capsule">
  <div class="music-capsule-bg"></div>
  <div class="music-capsule-controls">
    <button class="music-capsule-btn music-capsule-prev" aria-label="上一曲">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="music-capsule-btn music-capsule-play" aria-label="播放">
      <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="music-capsule-btn music-capsule-next" aria-label="下一曲">
      <svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6v12zm10-12v12h2V6h-2z"/></svg>
    </button>
  </div>
  <div class="music-capsule-cover">
    <img src="" alt="" />
  </div>
</div>

<script>
(function () {
  'use strict';

  var METING_API = '{{ . }}';
  var API_HOST = new URL(METING_API).host;
  // 歌单在构建时预取为静态 JSON（scripts/update-playlist.sh），首次访问即可秒显播放器
  var PLAYLIST_URL = '{{ "data/playlist.json" | relURL }}';
  var URL_CACHE_KEY = 'ap-direct-urls';
  var URL_TTL = 25 * 60 * 1000; // 网易云直链约 30 分钟过期，提前 5 分钟失效

  var capsule = document.getElementById('music-capsule');
  var coverImg = capsule.querySelector('.music-capsule-cover img');
  var controls = capsule.querySelector('.music-capsule-controls');
  var btnPlay = controls.querySelector('.music-capsule-play');
  var btnPrev = controls.querySelector('.music-capsule-prev');
  var btnNext = controls.querySelector('.music-capsule-next');

  var ap = null;
  var ids = []; // 与 ap.list.audios 同序的歌曲 id

  if (typeof APlayer === 'undefined') return;

  /* ---------- 直链缓存：命中后播放不走慢速 API ---------- */
  function readCache() {
    try { return JSON.parse(localStorage.getItem(URL_CACHE_KEY)) || {}; }
    catch (e) { return {}; }
  }

  function cacheSet(id, url) {
    var c = readCache();
    c[id] = { url: url, ts: Date.now() };
    try { localStorage.setItem(URL_CACHE_KEY, JSON.stringify(c)); } catch (e) {}
  }

  function cacheGetFresh(id) {
    var entry = readCache()[id];
    if (entry && Date.now() - entry.ts < URL_TTL) return entry.url;
    return null;
  }

  /* ---------- 直链解析：API 302 → 网易云 CDN，取最终地址 ---------- */
  function resolveDirectUrl(id, idx) {
    fetch(METING_API + '?server=netease&type=url&id=' + id)
      .then(function (resp) {
        var finalUrl = resp.url || '';
        if (!finalUrl || finalUrl.indexOf(API_HOST) !== -1) return; // 未拿到直链
        cacheSet(id, finalUrl);
        var audio = ap.list.audios[idx];
        if (!audio) return;
        audio.url = finalUrl;
        // 仍是当前曲目且未播放：换源并预缓冲，点击即可秒播
        if (ap.list.index === idx && ap.audio.paused) {
          ap.audio.src = finalUrl;
          ap.audio.preload = 'metadata';
          ap.audio.load();
        }
      })
      .catch(function () { /* 失败保留 API 跳转链接兜底 */ });
  }

  function prefetch(idx) {
    var id = ids[idx];
    if (id == null) return;
    var fresh = cacheGetFresh(id);
    if (fresh) {
      ap.list.audios[idx].url = fresh;
      // 仍是当前曲目且未播放：换源并预缓冲，点击即可秒播
      if (ap.list.index === idx && ap.audio.paused) {
        ap.audio.src = fresh;
        ap.audio.preload = 'metadata';
        ap.audio.load();
      }
      return;
    }
    resolveDirectUrl(id, idx);
  }

  /* ---------- 胶囊 UI 绑定 ---------- */
  function bindEvents() {
    // 首帧：封面就绪后再显示胶囊
    updateCover(ap, function () {
      capsule.classList.add('is-ready');
    });
    updatePlayState(ap);
    // 切歌 — listswitch + play 双保险
    ap.on('listswitch', function () {
      updateCover(ap);
      updatePlayState(ap);
      prefetch(ap.list.index);
    });
    ap.on('play', function () {
      updatePlayState(ap);
      updateCover(ap);
    });
    ap.on('pause', function () { updatePlayState(ap); });
  }

  function updateCover(ap, onReady) {
    var list = ap.list;
    var audio = list.audios[list.index];
    if (audio && audio.cover) {
      if (coverImg.src !== audio.cover) {
        coverImg.src = audio.cover;
        coverImg.alt = audio.name || '';
        coverImg.onload = function () { if (onReady) onReady(); };
        coverImg.onerror = function () { if (onReady) onReady(); };
      } else if (onReady && coverImg.complete && coverImg.naturalWidth > 0) {
        onReady();
      }
    } else if (onReady) {
      onReady();
    }
  }

  function updatePlayState(ap) {
    var playing = !ap.audio.paused;
    capsule.classList.toggle('is-playing', playing);
    capsule.classList.toggle('is-paused', !playing);
  }

  btnPlay.addEventListener('click', function () {
    if (!ap) return;
    ap.audio.paused ? ap.play() : ap.pause();
  });
  btnPrev.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!ap) return;
    var list = ap.list;
    if (!list.audios.length) return;
    var idx = list.index - 1;
    if (idx < 0) idx = list.audios.length - 1;
    list.switch(idx);
  });
  btnNext.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!ap) return;
    var list = ap.list;
    if (!list.audios.length) return;
    var idx = (list.index + 1) % list.audios.length;
    list.switch(idx);
  });

  /* 3 秒不 hover 自动隐藏 */
  var idleTimer = null;
  var IDLE_DELAY = 3000;

  capsule.addEventListener('mouseenter', function () {
    clearTimeout(idleTimer);
    capsule.classList.remove('is-idle');
  });
  capsule.addEventListener('mouseleave', function () {
    idleTimer = setTimeout(function () {
      capsule.classList.add('is-idle');
    }, IDLE_DELAY);
  });

  /* ---------- 初始化：静态歌单秒出，音频直链后台懒解析 ---------- */
  fetch(PLAYLIST_URL)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (list) {
      if (!Array.isArray(list) || !list.length) return;
      // Meting API 的歌单 JSON 没有顶层 id 字段，从 url 里提取
      function songId(s) {
        if (s.id != null) return s.id;
        var m = /[?&]id=(\d+)/.exec(s.url || s.lrc || '');
        return m ? m[1] : null;
      }
      var songs = [];
      list.forEach(function (s) {
        var id = songId(s);
        if (id != null) {
          s.id = id;
          songs.push(s);
        }
      });
      if (!songs.length) return;
      ids = songs.map(function (s) { return s.id; });
      ap = new APlayer({
        container: document.getElementById('aplayer-container'),
        fixed: true,
        autoplay: false,
        preload: 'none', // 初始不碰慢速 API，直链解析成功后再预缓冲
        volume: 0.7,
        audio: songs.map(function (s) {
          return {
            name: s.title || s.name || '未知歌曲',
            artist: s.author || s.artist || '',
            url: METING_API + '?server=netease&type=url&id=' + s.id,
            cover: s.pic || s.cover || '',
            lrc: METING_API + '?server=netease&type=lrc&id=' + s.id
          };
        })
      });
      bindEvents();
      prefetch(ap.list.index);
    })
    .catch(function (err) { console.error('歌单加载失败:', err); });
})();
</script>
{{- end -}}
