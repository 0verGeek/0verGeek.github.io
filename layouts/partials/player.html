{{ end }}
<script>
// 修复 Meting API 在生产环境（HTTPS）下返回 HTTP URL 导致的 Mixed Content 拦截
// 1. 拦截 fetch 请求，将 API 域名的 HTTP 请求升级为 HTTPS
// 2. 拦截 API 响应体，将 JSON 中的 HTTP URL 替换为 HTTPS（歌词和音频链接）
(function() {
    var _fetch = window.fetch;
    var apiHost = new URL('{{ .Site.Params.metingApi }}').host;
    var httpPrefix = 'http://' + apiHost;
    var httpsPrefix = 'https://' + apiHost;

    window.fetch = function(url, opts) {
        if (typeof url === 'string') {
            url = url.replace(httpPrefix, httpsPrefix);
        }

        var isApiCall = typeof url === 'string' && url.indexOf(apiHost) !== -1;
        var promise = _fetch.call(this, url, opts);

        if (isApiCall) {
            return promise.then(function(resp) {
                return resp.text().then(function(body) {
                    return new Response(body.split(httpPrefix).join(httpsPrefix), resp);
                });
            });
        }
        return promise;
    };
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/meting@2/dist/Meting.min.js"></script>
