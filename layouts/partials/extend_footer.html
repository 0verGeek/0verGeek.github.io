{{- if and (.Param "ShowPageViews") site.Params.walineServerURL }}
{{- $serverURL := site.Params.walineServerURL }}
<script>
    (function () {
        if (document.getElementById('waline')) return;

        var serverURL = '{{ $serverURL }}';

        function refreshPageviews(update) {
            import('https://unpkg.com/@waline/client@v3/dist/pageview.js').then(function (mod) {
                mod.pageviewCount({
                    serverURL: serverURL,
                    path: window.location.pathname,
                    update: update,
                });
            });
        }
        refreshPageviews(true);
    })();
</script>
{{- end }}
<script async src="//cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>

<span class="footer-stats">
    📂 {{ len .Site.Taxonomies.categories }} 个分类 ·
    🏷️ {{ len .Site.Taxonomies.tags }} 个标签 ·
    📝 {{ .Site.RegularPages.Len }} 篇文章 ·
    👀本站总访问量 <span id="busuanzi_site_pv">加载中...</span> 次
    ☀️今日总访客数 <span id="busuanzi_today_uv">加载中...</span> 人
</span>

<script>
    (function () {
        // 页脚统计注入到 <footer> 内部顶部
        var stats = document.querySelector('.footer-stats');
        var footer = document.querySelector('footer.footer');
        if (stats && footer) {
            footer.insertBefore(stats, footer.firstChild);
        }
    })();
</script>

<script>
    (function () {
        var topLink = document.getElementById('top-link');
        if (!topLink) return;

        // 替换为自定义结构（三角 SVG + 阅读进度），保留主题的 hidden 类
        topLink.innerHTML = '<span class="topInner">' +
            '<svg class="topSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 6" fill="currentColor">' +
            '<path d="M12 6H0l6-6z" />' +
            '</svg>' +
            '<span id="read_progress"></span>' +
            '</span>';

        // 阅读进度监听（addEventListener 不与主题 window.onscroll 冲突）
        document.addEventListener('scroll', function () {
            var el = document.getElementById('read_progress');
            if (!el) return;
            var sh = document.documentElement.scrollHeight;
            var ch = document.documentElement.clientHeight;
            var st = document.documentElement.scrollTop || document.body.scrollTop;
            el.innerText = ((st / (sh - ch)).toFixed(2) * 100).toFixed(0);
        });
    })();
</script>
